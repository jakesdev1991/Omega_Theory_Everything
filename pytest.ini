# pytest configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Scope notes (mirroring ruff.toml and mypy.ini):
#
# - Sim1, Sim2 and Sim4 are prose manuscripts stored with a .py extension and
#   are not executable Python; they contain no tests, so no exclusion is needed
#   here.
# - `mcp/` is excluded. `mcp/smoke_test.py` imports `omega_mcp`, which does
#   `from mcp.server import FastMCP` — that is the MCP Python SDK, a dependency
#   declared only in mcp/pyproject.toml (requires-python >=3.12) and not in the
#   root requirements.txt. Worse, when pytest is invoked from the repository
#   root it puts the root on sys.path, so the top-level directory named `mcp/`
#   shadows the PyPI `mcp` package and the import fails with
#   "No module named 'mcp.server'". The hub has its own uv/venv boundary and
#   its own CI job; keep it there.
#
# With this file in place, `pytest` from the repository root collects the whole
# Python suite (conjecture_pilot + lean_proofs) and passes.
[pytest]
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    mcp
