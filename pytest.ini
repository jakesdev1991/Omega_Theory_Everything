# pytest configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Scope notes (mirroring ruff.toml and mypy.ini):
#
# - Every `.py` file at the repository root is executable Python: Sim1 and Sim4
#   are manuscripts and live in docs/manuscripts/ as `.md`, and Sim2's prose
#   header is a module docstring. See docs/manuscripts/README.md.
# - `mcp/` is excluded. `mcp/smoke_test.py` imports `omega_mcp`, which does
#   `from mcp.server import FastMCP` — that is the MCP Python SDK, a dependency
#   declared only in mcp/pyproject.toml (requires-python >=3.12) and not in the
#   root requirements.txt. Worse, when pytest is invoked from the repository
#   root it puts the root on sys.path, so the top-level directory named `mcp/`
#   shadows the PyPI `mcp` package and the import fails with
#   "No module named 'mcp.server'". The hub has its own uv/venv boundary and
#   its own CI job; keep it there.
#
# With this file in place, `pytest` from the repository root collects the whole
# Python suite (conjecture_pilot + lean_proofs + tests/) and passes.
[pytest]
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    mcp
# omni-bridge's host scripts are deployed runtime scripts, not tests: their
# shebang points at /opt/omni-bridge/runtime/venv/bin/python and they import
# the `omni_bridge` package that exists only inside that runtime image. Two of
# them (`smoke_test.py`, `omega_live_test.py`) match pytest's default `*_test.py`
# file pattern, so collection used to die with "No module named 'omni_bridge'"
# before a single real test ran. The bridge's C++ acceptance suite in
# omni-bridge/cpp owns verification for that component and runs in CI.
addopts = --ignore=omni-bridge/host/scripts
