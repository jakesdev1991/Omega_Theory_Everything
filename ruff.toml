# Ruff configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Notes on scope:
# - Every `.py` file at the repository root is executable Python. Sim1 and Sim4
#   are prose manuscripts, not scripts, and live in `docs/manuscripts/` as
#   `.md`; Sim2's prose header is a module docstring, so the code below it is
#   ordinary Python. There are no longer any Python files excluded here.
# - The rule set is deliberately the bug-catching core (pycodestyle
#   error subsets, pyflakes, import sorting, modernization) rather
#   than the opinionated families (PL/SIM/B/RUF): the research code
#   legitimately uses long functions, module-level simulation state,
#   Greek letters in output strings, and en-dashes in prose.
target-version = "py38"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
