# Ruff configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Notes on scope:
# - Sim1, Sim2 and Sim4 are prose manuscripts stored with a .py extension;
#   they are not executable Python (Sim3, Sim5 and sim6 are). They are excluded
#   from Python tooling rather than renamed here because links and
#   external references depend on the current names; renaming them is
#   a separate decision for the repository owner.
# - The rule set is deliberately the bug-catching core (pycodestyle
#   error subsets, pyflakes, import sorting, modernization) rather
#   than the opinionated families (PL/SIM/B/RUF): the research code
#   legitimately uses long functions, module-level simulation state,
#   Greek letters in output strings, and en-dashes in prose.
extend-exclude = [
    "Sim1_Emergent_Geometry.py",
    "Sim2_Cosmology.py",
    "Sim4_Evolution.py",
]

target-version = "py38"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
