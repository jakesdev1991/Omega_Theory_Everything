[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onset-eval"
version = "0.1.0"
description = "Pre-registered evaluation harness for onset-prediction claims: fixed protocol, rare-event metrics, paired baseline tests."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jacob See" }]
keywords = [
  "evaluation",
  "rare-event",
  "change-point",
  "time-series",
  "pre-registration",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # NumPy is the only hard requirement: Series, Arm, label_onsets and the CSV
  # loader work without anything else, which is what keeps the harness usable
  # in a minimal analysis environment. The modelling and significance steps
  # import scikit-learn and SciPy lazily; see the [full] extra.
  "numpy>=1.24",
]

[project.optional-dependencies]
full = ["scipy>=1.10", "scikit-learn>=1.3"]
test = ["pytest>=8", "scipy>=1.10", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/jakesdev1991/Omega_Theory_Everything"
Documentation = "https://github.com/jakesdev1991/Omega_Theory_Everything/blob/main/docs/DOMAIN_AGNOSTIC_CORE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/onset_eval"]

[tool.hatch.build.targets.sdist]
include = ["src/onset_eval", "tests", "README.md", "LICENSE", "pyproject.toml"]
