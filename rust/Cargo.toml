[workspace]
members = [
  "crates/protocol-types",
  "crates/ledger",
  "crates/work-claims",
  "crates/simulation",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
protocol-types = { path = "crates/protocol-types" }
ledger = { path = "crates/ledger" }
work-claims = { path = "crates/work-claims" }
