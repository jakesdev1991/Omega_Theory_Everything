[project]
name = "omega-mcp-hub"
version = "0.1.0"
description = "Prototype MCP server for an in-memory Omega tri-token economy simulation; no real chain, keys, or value."
readme = "README_MCP_HUB.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = [
    # Keep the SDK on v1 until this package is migrated: MCP SDK 2.x renamed
    # FastMCP to MCPServer and moved it out of mcp.server (see
    # https://py.sdk.modelcontextprotocol.io/v2/migration/#fastmcp-renamed-to-mcpserver),
    # so an unbounded `mcp>=1.7.0` can fail at import time.
    "mcp>=1.7.0,<2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
omega-hub = "omega_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omega_mcp"]
