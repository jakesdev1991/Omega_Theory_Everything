[project]
name = "omega-mcp-hub"
version = "0.1.0"
description = "Sovereign MCP hub for the Omega tri-token economy: SOV, USE, CARE, AMITY, OMEGA planes."
readme = "README_MCP_HUB.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.7.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
omega-hub = "omega_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omega_mcp"]
