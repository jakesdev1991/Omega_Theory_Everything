    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#b4a2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
