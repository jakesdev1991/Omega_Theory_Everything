<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title description">
  <title id="title">The C.A.R.E. Economy — website, whitepapers, wallet and MCP system map</title>
  <desc id="description">A repository-level map of the Next.js website, the whitepaper publishing pipeline, the local-first wallet and its optional testnet proof flow, and the separate simulated Omega MCP Hub. It distinguishes three public economy currencies from five MCP operating planes and notes that the public novel needs no wallet or token.</desc>
