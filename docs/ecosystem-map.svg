      <stop offset="1" stop-color="#0e111b"/>
    </linearGradient>
    <linearGradient id="webGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122337"/>
      <stop offset="1" stop-color="#111622"/>
