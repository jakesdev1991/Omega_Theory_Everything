# mypy configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Sim1, Sim2 and Sim4 are prose manuscripts stored with a .py extension;
# they are not executable Python (Sim3, Sim5 and sim6 are). See ruff.toml for the same
# exclusion and the rationale (renaming them is a separate decision for
# the repository owner).
[mypy]
exclude = Sim[124]_[A-Za-z_]+\.py
ignore_missing_imports = True
