# mypy configuration for this repository.
# Copyright (c) 2025-2026 Jacob See.
#
# Sim1 and Sim4 are prose manuscripts and live in `docs/manuscripts/` as `.md`,
# so no Python file needs excluding here. Sim2's prose header is a module
# docstring and its code is ordinary, type-checked Python.
[mypy]
ignore_missing_imports = True

# Two independent smoke tests are both top-level modules named `smoke_test`:
# `mcp/smoke_test.py` (the MCP hub) and `omni-bridge/host/scripts/smoke_test.py`
# (the bridge's end-to-end script). A root-level `mypy .` maps both to the same
# module name and aborts with "Duplicate module named 'smoke_test'", so nothing
# in the tree got type-checked at all. The MCP hub already sits on its own
# uv/venv boundary for pytest (see pytest.ini) and has its own CI job, so the
# same boundary applies here and the bridge script keeps the root check.
exclude = ^mcp/smoke_test\.py$

warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
no_implicit_optional = True
check_untyped_defs = True
