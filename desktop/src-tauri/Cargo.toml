[package]
name = "omega-wallet-desktop"
version = "0.1.0"
description = "Tauri v2 wrapper packaging the synced Omega wallet GUI as a native app."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "omega_wallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
