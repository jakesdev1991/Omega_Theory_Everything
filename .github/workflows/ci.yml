name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  # TruffleHog derives its commit range from the event: push = before..after,
  # pull_request = base..head, but schedule AND workflow_dispatch = full history.
  # So this is the only way to re-run the full-history secret scan on demand
  # instead of waiting for the Sunday cron.
  workflow_dispatch:

# A burst of pushes used to queue whole CI runs behind each other (four full
# runs were waiting at once on 2026-11-05). Cancel superseded runs on the same
# ref, but never on main: every push there is a merge worth verifying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: read-only contents. The one job that needs more
# (security-scan and its security-events: write) declares it on the job itself.
permissions:
  contents: read

# Keep Linux jobs on an explicit Ubuntu image so a ubuntu-latest migration
# cannot silently change the compiler and system-library baseline.
jobs:
  python-checks:
    name: Python Lint & Type Check
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        # The README's Quick Start tells a reader to run
        # `pip install -r requirements.txt`; CI now installs the same file, so
        # the documented path is the tested path. It carries the pinned
        # ruff/mypy/pytest versions too, so a tool release cannot change a
        # verdict here without a commit.
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      
      - name: Ruff lint
        run: ruff check .
      
      - name: Ruff format check
        run: ruff format --check .
      
      - name: MyPy type check
        run: mypy . --ignore-missing-imports
      
      - name: Python tests
        # conjecture_pilot (24) + lean_proofs source/build/kernel audits (41).
        # pytest.ini keeps mcp/ out of collection: it needs the MCP SDK on its
        # own uv/venv boundary (see the comment in that file).
        run: python -m pytest -v
      
      - name: Build and install the onset-eval package
        # `packages/onset_eval` is a distributable (someone is meant to
        # `pip install` it), so the artifact under test is the distribution, not
        # the source tree: build a wheel, install it into a virtual environment
        # that cannot see this checkout, and run its tests from /tmp. A wheel
        # that forgets a module, `py.typed` or the LICENSE fails here instead of
        # in somebody else's project.
        run: |
          set -euo pipefail
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install -q --upgrade pip
          /tmp/pkg-venv/bin/pip install -q './packages/onset_eval[test]'
          /tmp/pkg-venv/bin/python -c "
          import onset_eval, sys
          assert 'site-packages' in onset_eval.__file__, onset_eval.__file__
          assert onset_eval.__version__
          print('installed', onset_eval.__version__, 'from', onset_eval.__file__)
          "
          cp packages/onset_eval/tests/test_harness.py /tmp/
          cd /tmp && /tmp/pkg-venv/bin/python -m pytest -q test_harness.py

      - name: Run simulations (smoke test)
        # No `|| true` here. The previous version ended every command with it,
        # which is how sim6_v14_depletion.py stayed broken: it raised
        # "array must not contain infs or NaNs" on every run and the step still
        # reported success. Every command below must exit 0.
        #
        # Sim1 and Sim4 are prose manuscripts in docs/manuscripts/ (they were
        # never executable; see docs/manuscripts/README.md), so they are not
        # run here. Sim2 runs headless under Agg. Sim3/Sim5/Sim7 accept --help;
        # sim6 has no argument parser and is run for real.
        env:
          MPLBACKEND: Agg
        run: |
          python Sim2_Cosmology.py
          python Sim3_Dynamic_Scale.py --help
          python Sim5_Emergent_Gravity.py --help
          python sim6_v14_depletion.py
          python Sim7_Radial_Metric.py --help

  rust-checks:
    name: Rust Build & Test
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The action takes its toolchain from the ref name; with an immutable
          # SHA pin the input is what keeps this on stable.
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Build and test
        run: |
          cd rust
          cargo build --workspace
          cargo test --workspace

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust workspace dependencies
        working-directory: rust
        run: |
          cargo generate-lockfile
          cargo audit

      - name: Audit Tauri desktop dependencies
        working-directory: desktop/src-tauri
        run: |
          cargo generate-lockfile
          cargo audit

  evm-contracts:
    name: EVM Contract Build & Test
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: evm/package-lock.json

      - name: Install locked dependencies
        working-directory: evm
        run: npm ci

      - name: Compile and run contract tests
        working-directory: evm
        run: npm run check

      - name: Rehearse the Sepolia preflight (local network, nothing broadcast)
        # The preflight's job is to refuse to proceed, so its passing path needs a
        # configuration that should pass. The local network is pinned to Sepolia's
        # chain ID, so this exercises the same checks without a key or a network.
        working-directory: evm
        run: npm run preflight:rehearsal

      - name: Check runtime dependency advisories
        working-directory: evm
        run: npm audit --omit=dev --audit-level=high

      - name: Audit the full Hardhat development and runtime dependency tree
        # Hardhat 3 has been migrated and the pinned solc compiler's vulnerable
        # tmp transitive dependency is overridden to the patched release. Gate
        # the complete dependency tree so future advisories cannot silently pass.
        # Accepted advisories live in evm/AUDIT_ALLOWLIST.md with reasons and
        # review dates; the audit fails on anything not listed there.
        working-directory: evm
        run: npm audit

  solana-pilot:
    name: Solana Devnet Pilot Checks
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: solana/package-lock.json

      - name: Install locked dependencies
        working-directory: solana
        run: npm ci

      - name: Run offline pilot tests
        working-directory: solana
        run: npm run check

      - name: Check dependency advisories
        working-directory: solana
        run: npm audit --audit-level=high

  web-app:
    name: Web App Build & Economy Tests
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Check production dependency advisories
        working-directory: web
        # Gate on the tree that actually ships. web/'s production dependencies
        # (next, react, react-dom, ethers, nostr-tools, tweetnacl, bs58) carry no
        # advisory; every open finding comes from the build-only
        # @opennextjs/cloudflare -> @opennextjs/aws -> @node-minify/core -> glob
        # chain, for which npm's only remedy was a downgrade to a pre-1.0
        # adapter. A build tool with no runtime path should not block the deploy,
        # but it should not be invisible either, so the full tree is printed.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit || true

      - name: Sync the wallet GUI into the web app
        working-directory: web
        run: npm run sync:wallet

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Domain, economy, Nostr, and unlock-proof tests
        working-directory: web
        run: npm test

      - name: Wallet security regression tests
        working-directory: web
        run: npm run test:wallet

      - name: Production build
        working-directory: web
        run: npm run build

  mobile-node:
    name: Mobile Node Tests (NIP-90 daemon)
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-node/package-lock.json

      - name: Install locked dependencies
        working-directory: mobile-node
        run: npm ci

      - name: Check dependency advisories
        working-directory: mobile-node
        run: npm audit --audit-level=high

      - name: Run daemon, policy, executor, and integration tests
        working-directory: mobile-node
        run: npm test

  amity-pilot:
    name: AMITY Testnet Scaffold Checks
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: amity/package-lock.json

      - name: Install locked dependencies
        working-directory: amity
        run: npm ci

      - name: Check dependency advisories
        working-directory: amity
        run: npm audit --audit-level=high

      - name: Run config, manifest, proof, policy, and holder-verification tests
        working-directory: amity
        run: npm test

  nostr-client:
    name: Nostr Client Checks
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nostr-client/package-lock.json

      - name: Install locked dependencies
        working-directory: nostr-client
        run: npm ci

      - name: Check dependency advisories
        working-directory: nostr-client
        run: npm audit --audit-level=high

      # test/live.test.mjs needs a reachable relay and skips itself without one,
      # so this runs the unit and integration suites offline.
      - name: Run unit and integration tests
        working-directory: nostr-client
        run: npm test

  cpp-suites:
    name: C++ Acceptance Suites (CBwK pacer + Omni-Bridge)
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-24.04 ships GCC with C++23 support, which both suites require.
      - name: Compiler version
        run: g++ --version

      # Both scripts run their full config matrix: a strict
      # -Wall -Wextra -Werror build, then ThreadSanitizer, then
      # AddressSanitizer + UBSan (cpp/ adds a forced pre-C++23 fallback build).
      # They complete in well under a minute, so there is no reason to run the
      # weaker --quick path in CI.
      - name: CBwK shadow-price pacer suite
        working-directory: cpp
        run: ./build.sh

      - name: Omni-Bridge control-boundary acceptance suite
        working-directory: omni-bridge/cpp
        run: ./build.sh

  mcp-hub:
    name: Omega MCP Hub Smoke Test
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # mcp/pyproject.toml declares requires-python = ">=3.12"; the root
          # python-checks job stays on 3.11 and deliberately does not collect
          # mcp/ (see pytest.ini).
          python-version: '3.12'

      - name: Install the hub and its dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ./mcp pip-audit==2.10.1

      - name: Audit MCP dependencies
        run: pip-audit mcp

      # smoke_test.py checks runtime descriptions against the manifest, starts
      # Streamable HTTP on a test socket, validates CARE/SOV state invariants,
      # checks the five state planes, and exercises a real stdio JSON-RPC round trip.
      - name: Run smoke test
        run: python mcp/smoke_test.py

  ai-governor:
    name: AI Governor Build & Smoke Run (PoUW trainer)
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The governor is the Proof-of-Useful-Work trainer for the Lucifer
      # framework. It had no build command anywhere in the repository and was in
      # no CI job, so nothing verified that it compiles. It needs OpenSSL headers
      # for the SHA-256 receipt digest; the runner image does not always ship
      # libssl-dev, so install it explicitly.
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      # build.sh runs a strict -Wall -Wextra -Werror build and then a 300-step
      # governed + baseline smoke run, requiring receipts from both.
      - name: Build and smoke-run the governor
        run: ./build.sh
        working-directory: ai-governor

  wallet-desktop:
    name: Wallet Desktop Wrapper Checks
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      # The Tauri installer workflow (wallet-desktop.yml) only runs on a
      # `wallet-v*` tag or by manual dispatch, and no tag has ever been cut, so
      # nothing has ever exercised desktop/ in CI. Install both lockfiles (they
      # are committed but were never installed anywhere) and check the four
      # version strings, the paths Tauri bundles, and the release manifest.
      - name: Install the desktop wrapper's locked dependencies
        run: npm ci
        working-directory: desktop

      - name: Check desktop dependency advisories
        run: npm audit --audit-level=high
        working-directory: desktop

      - name: Install the wallet GUI's locked dependencies
        run: npm ci
        working-directory: web

      # The wallet GUI is built out of web/, so this job installs web/'s lockfile
      # below. It used to run its own `npm audit` over that lockfile too, which
      # could only ever repeat the verdict of the Web App job's advisory gate on
      # the same file -- and, when it turned red, made two jobs report one cause.
      # web/'s production tree is gated there; the desktop wrapper's own tree is
      # still audited above.

      - name: Run wallet security regression tests
        run: npm run test:wallet
        working-directory: web

      - name: Sync the wallet GUI into the web app
        run: npm run sync:wallet
        working-directory: web

      - name: Check wrapper consistency
        run: node desktop/scripts/check-wrapper.mjs

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
      # Required by github/codeql-action/upload-sarif to publish to Code Scanning.
      security-events: write
      # Required by upload-sarif to read workflow run metadata.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog scans commit ranges, so it needs history (not a shallow clone).
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        # Pinned to a tag, not @master: a floating ref on a security job is a
        # supply-chain risk (any upstream push lands here unreviewed).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        # Fork PRs never get a write token for security-events, so skip there.
        if: >-
          ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Check for secrets
        # Run regardless of whether the SARIF upload succeeded.
        if: ${{ !cancelled() }}
        # Pinned to a tag, not @main — see the note on trivy-action above.
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # No explicit base/head: the action derives the range from the event
          # (push: before..after, pull_request: base..head, schedule and
          # workflow_dispatch: full history).
          # Hard-coding base=main/head=HEAD fails on pushes to main (BASE == HEAD).
          path: .
          # -x/--exclude-paths: file of newline-separated regexes. Generated
          # lockfiles are excluded because they are machine-written and are the
          # single largest source of false positives here (the Box detector
          # fires on the package names `hardhat-toolbox`, `boxen` and
          # `cli-boxes` inside evm/package-lock.json, which contains no
          # credentials — only npm sha512 integrity hashes). Dependabot
          # regenerates these files, and Trivy already scans them for
          # vulnerable dependencies. Every hand-written file stays scanned.
          extra_args: --exclude-paths=.github/trufflehog-exclude-paths.txt

  docs:
    name: Documentation Check
    runs-on: ubuntu-24.04
    # A hung step should fail the job, not hold a runner for the 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Check for README
        run: test -f README.md
      
      - name: Validate markdown links
        # Relative links are already covered by tests/test_markdown_links.py; this
        # only has to police outbound URLs. Two things made it fail non-
        # deterministically before: markdown-link-check treats a 403 from a host
        # that blocks non-browser user agents as a failure, and it gives up on the
        # first timeout. mlc_config.json (the action's default config path) sets
        # retries, a timeout, and the status codes to accept.
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          config-file: mlc_config.json
          use-quiet-mode: 'yes'
