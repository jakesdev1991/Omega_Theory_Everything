name: Lean CI

# Kernel-checks the Lean formalization and runs source-honesty gates.
# Path-filtered so unrelated pushes do not pay for a Lean build.

on:
  push:
    # The arena/* branches that used to be listed here were temporary review
    # snapshots ("also validate this snapshot when PR merge conflicts block PR
    # checks"). Those were merged (PRs #45, #49) and no longer exist, so main is
    # the only permanent push trigger; every other branch is covered by the
    # pull_request trigger below.
    #
    # This list briefly also carried the arena/e789c885-* session branch, while
    # the Lean build was red and no PR check could pass. It is green now, so the
    # temporary entry is gone and this file is back to its intended shape.
    branches: [main]
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean-ci.yml'

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    name: Lean build (mathlib cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source audits and proof build coverage
        run: python3 -m unittest discover -s lean_proofs -p 'test_*.py'

      - name: Gate - no sorry / trivial stubs in sources
        working-directory: lean_proofs
        run: |
          set -e
          if grep -rn --include='*.lean' --exclude-dir=.lake -E '\bsorry\b|\badmit\b|\bnative_decide\b|\bsorryAx\b|@\[extern|\bimplemented_by\b|\bopaque\b|\bunsafe\b|^\s*partial\s+def\b|: True :=|:= by trivial' . ; then
            echo "::error::Found sorry/admit/native_decide/extern/opaque/unsafe/partial or trivial stubs in lean sources"
            exit 1
          fi
          echo "Clean: no sorry/trivial stubs."
          python3 audit_axioms.py --max 0
          # Phase 5 parity: a comment/docstring-only edit must leave every
          # declaration byte-identical, and the plain-text mirrors must track
          # the Lean sources. Both are baseline ratchets; a deliberate code
          # change needs `check_declaration_parity.py --update` and
          # `sync_txt_mirrors.py --write` in the same commit.
          python3 check_declaration_parity.py
          python3 sync_txt_mirrors.py
          # Honesty ratchet: degenerate-model tautologies may only exist under
          # the `bridge_*` naming convention, `Nonempty Unit` stubs and
          # `Unit`-typed volume definitions may only decrease, and no
          # declaration/field may be *named* `axiom_*`/`*_axiom` (the corpus
          # contains zero real axioms). Decorative hypotheses (unused in
          # statement and proof), hypotheses whose type is a closed truth
          # (`0 ≤ 0`), and identity proofs (`P → P`, tactic- or term-mode) are
          # ratcheted at zero as well. See audit_vacuity.py for the metric
          # definitions.
          python3 audit_vacuity.py \
            --max-misleading 0 --max-axiom-names 0 \
            --max-unit-stubs 0 --max-unit-types 0 \
            --max-decorative-hypotheses 0 --max-trivial-hypotheses 0 \
            --max-identity-proofs 0 --max-trivial-proofs 0 \
            --alias-baseline legacy_statement_aliases.json

      # Official Lean action: installs elan + pinned toolchain, fetches
      # prebuilt mathlib oleans, and runs `lake build ToE` in lean_proofs/.
      - uses: leanprover/lean-action@v1
        id: lean_build
        with:
          lake-package-directory: lean_proofs
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
          build: true
          build-args: "ToE"
          test: false
          lint: false

      # Ratchet for qualified names used in the corpus: `check_mathlib_names.py`
      # indexes every declaration in mathlib and in the toolchain's own core
      # sources and reports repository names that exist in neither. It needs
      # those pinned sources, so -- like `lake build` -- it is CI-only and
      # deliberately absent from the offline consistency gate.
      #
      # `if: always()` is deliberate: the check reads sources, not oleans, so it
      # does not need a successful compile, and a compile failure is exactly
      # when a list of suspect names is worth having. Both trees must be real;
      # the checker exits 2 rather than reporting a clean run on an empty index.
      - name: Gate - cited names exist in the pinned mathlib/Lean sources
        if: always()
        working-directory: lean_proofs
        run: |
          set -e
          # The mathlib checkout is found, not assumed: the requirement is named
          # `mathlib4` in lakefile.lean and lands in the manifest's packages dir.
          # A renamed requirement must not quietly turn this gate off, so the
          # fallback search looks for the checkout that actually holds Mathlib/.
          mathlib=""
          for candidate in .lake/packages/mathlib4 .lake/packages/mathlib; do
            if [ -d "$candidate/Mathlib" ]; then mathlib="$candidate"; break; fi
          done
          if [ -z "$mathlib" ]; then
            mathlib="$(find .lake/packages -maxdepth 2 -type d -name Mathlib 2>/dev/null | head -n1)"
            mathlib="${mathlib%/Mathlib}"
          fi
          if [ -z "$mathlib" ] || [ ! -d "$mathlib/Mathlib" ]; then
            echo "::error::pinned mathlib sources are missing under $PWD/.lake/packages"
            echo "::error::they are fetched by the Lean build step above, so this also happens when an earlier step failed"
            # Annotations are readable through the API even where the raw log is
            # not, so the listing needed to fix a rename is an annotation too.
            echo "::error::entries under .lake/packages: $(ls .lake/packages 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          # lean-action puts elan on PATH; fall back to its install dirs so the
          # step does not depend on that detail.
          for bin in "${ELAN_HOME:-$HOME/.elan}/bin" "$HOME/.elan/bin"; do
            if [ -x "$bin/lean" ]; then export PATH="$bin:$PATH"; break; fi
          done
          prefix="$(lean --print-prefix 2>/dev/null)" || prefix=""
          if [ -z "$prefix" ]; then
            echo "::error::cannot locate the pinned toolchain ('lean --print-prefix' failed)"
            exit 1
          fi
          # The pinned construction installs its core sources to <prefix>/src/lean
          # (src/CMakeLists.txt, `install(... DESTINATION src/lean)`), so the
          # location is derived, not guessed; print the prefix when it drifts.
          lean_src="$prefix/src/lean"
          if [ ! -d "$lean_src/Init" ]; then
            echo "::error::Lean core sources not found at $lean_src"
            echo "::error::entries under $prefix: $(ls "$prefix" 2>/dev/null | tr '\n' ' ')"
            echo "::error::entries under $prefix/src: $(ls "$prefix/src" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "mathlib: $mathlib; Lean core: $lean_src"
          python3 check_mathlib_names.py --mathlib "$mathlib" --lean "$lean_src" --repo . --max 0

      # Phase 6 statement-level audit: every theorem/lemma in `Vol*.lean` whose
      # name carries a lexicon word must have a row in `statement_audit.json`
      # (witness / conditional / renamed / carried), and the number of `carried`
      # rows is ratcheted by the file's own `carried_cap`. The check is lexical
      # and runs offline too (it is a command in research/consistency_gate.py);
      # the *judgements* are only as strong as this job, whose build compiles
      # every witness and source a row names. `if: always()` is deliberate: a
      # compile failure is exactly when an unreadable or incomplete audit should
      # still be reported rather than hidden.
      - name: Gate - statement audit of the physics volumes
        if: always()
        working-directory: lean_proofs
        run: |
          set -e
          python3 check_statement_audit.py --repo .

      - name: Audit transitive kernel axioms of key declarations
        working-directory: lean_proofs
        run: python3 audit_kernel.py

      # Re-run the build when lean-action fails and surface the compiler
      # diagnostics as check-run annotations (the raw action log is otherwise
      # hard to find).
      - name: Surface Lean build errors
        if: failure() && steps.lean_build.outcome == 'failure'
        working-directory: lean_proofs
        run: |
          set +e
          lake build ToE > /tmp/lake-build.log 2>&1
          rc=$?
          # Emit every compiler diagnostic (not just the tail) as
          # annotations; include continuation lines of multi-line errors.
          sed '/^trace: /d' /tmp/lake-build.log | awk '/^error:|failures/{p=18} p>0{print; p--}' \
            | awk 'BEGIN{ORS=""} {buf = buf $0 "\\n"; n++; if (n % 25 == 0) {print "::error::LOG>> " substr(buf, 1, 8000) "\n"; buf=""}} END{if (buf != "") print "::error::LOG>> " substr(buf, 1, 8000)}'
          if [ "$rc" -eq 0 ]; then
            echo "::notice::lake build re-run exited 0 (original failure was transient)"
          else
            echo "::error::lake build re-run exited $rc"
          fi
