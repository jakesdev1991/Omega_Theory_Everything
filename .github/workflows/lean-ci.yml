name: Lean CI

# Temporary gate: kernel-checks the Omega Protocol Lean formalization.
# Path-filtered so non-Lean pushes don't pay for it.
# Delete this file to remove the job.

on:
  push:
    branches: [main]
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lean_proofs/**'
      - '.github/workflows/lean-ci.yml'

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    name: Lean build (mathlib cache)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Official Lean action: installs elan + pinned toolchain, fetches
      # prebuilt mathlib oleans, and runs `lake build ToE` in lean_proofs/.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_proofs
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
          build: true
          build-args: "ToE"
          test: false
          lint: false

      # Re-run the build when lean-action fails and surface the compiler
      # diagnostics as check-run annotations (the raw action log is otherwise
      # hard to find).
      - name: Surface Lean build errors
        if: failure()
        working-directory: lean_proofs
        run: |
          set +e
          lake build ToE > /tmp/lake-build.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice::lake build re-run exited 0 (original failure was transient)"
          else
            echo "::error::lake build re-run exited $rc"
          fi
          grep -E '\.lean:[0-9]+:[0-9]+' /tmp/lake-build.log | grep -E 'error|warning' | head -n 25 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/"/\\"/g' | cut -c1-600)
            echo "::error::$msg"
          done
          tail -n 25 /tmp/lake-build.log | while IFS= read -r line; do
            msg=$(printf 'LOG| %s' "$line" | tr -d '\r' | sed 's/"/\\"/g' | cut -c1-600)
            echo "::error::$msg"
          done

      - name: Gate - no sorry / trivial stubs in sources
        working-directory: lean_proofs
        run: |
          set -e
          if grep -rn --include='*.lean' --exclude-dir=.lake -E '\bsorry\b|: True :=|:= by trivial' . ; then
            echo "::error::Found sorry or trivial stubs in lean sources"
            exit 1
          fi
          echo "Clean: no sorry/trivial stubs."
          python3 audit_axioms.py --max 0
