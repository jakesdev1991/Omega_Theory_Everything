name: Wallet Desktop Release

on:
  push:
    tags:
      - 'wallet-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb
            args: --bundles appimage,deb
          - platform: macos-14
            bundles: dmg
            args: --bundles dmg
          - platform: windows-2022
            bundles: msi
            args: --bundles msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Sync wallet GUI into web/public
        working-directory: web
        run: |
          npm ci
          npm run sync:wallet

      - name: Build desktop bundle
        working-directory: desktop
        run: |
          npm install
          npx tauri build --target-dir target ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-wallet-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish:
    name: Attach to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/wallet-v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/**/* --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Next step for maintainers
        run: |
          echo "Record the published artifacts (os, arch, fileName, url, sha256) in desktop/releases.json"
          echo "so /wallet/download can link them with checksums."
